# Starts the panel and one local agent. Set the two secrets in a .env file
# (see .env.example) before running: docker compose up -d
services:
  panel:
    build: .
    command: panel
    ports:
      - "8080:8080"
    environment:
      PANEL_ADMIN_PASSWORD: ${PANEL_ADMIN_PASSWORD:?set in .env}
      PANEL_AGENT_TOKEN: ${PANEL_AGENT_TOKEN:?set in .env}
      PANEL_DATA_DIR: /data/panel
      # Schedules run in this time zone, e.g. America/Chicago. Set TZ in .env.
      TZ: ${TZ:-UTC}
    volumes:
      - ./data:/data
    restart: unless-stopped

  agent:
    build: .
    command: agent
    environment:
      AGENT_PANEL_URL: ws://panel:8080/agent/connect
      AGENT_TOKEN: ${PANEL_AGENT_TOKEN:?set in .env}
      AGENT_NAME: local
      AGENT_DATA_DIR: /srv/watchtower
    volumes:
      # The agent starts game servers as sibling containers through the host's Docker.
      - /var/run/docker.sock:/var/run/docker.sock
      # Game server files. Mounted at the same path inside and outside the
      # container, because Docker resolves the servers' volume paths on the host.
      - /srv/watchtower:/srv/watchtower
    depends_on:
      - panel
    restart: unless-stopped
