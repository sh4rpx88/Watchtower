<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a090a" />
    <title>Watchtower</title>
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0a090a; color: #ddd6cf;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; padding: 16px; box-sizing: border-box; }
      img { width: 96px; height: 96px; border-radius: 22px; }
      h1 { font-family: Georgia, serif; font-weight: 500; letter-spacing: 0.08em; margin: 18px 0 8px; }
      p { color: #8d847e; max-width: 340px; line-height: 1.5; margin: 0 auto 20px; }
      button { font: inherit; color: #fff; background: linear-gradient(#a51d27, #7c141c); border: 1px solid #c8323b;
        border-radius: 3px; padding: 10px 22px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>Watchtower</h1>
      <p>Can't reach the panel right now. Check that you're on your home network or connected to Tailscale.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
